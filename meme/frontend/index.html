<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast - Weather Forecast</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-default">
    <div class="background-overlay"></div>
    
    <div class="app-container">
        <!-- Header & Search -->
        <header>
            <div class="logo">
                <i class="fa-solid fa-cloud-sun-rain"></i>
                <h1>SkyCast</h1>
            </div>
            <div class="search-container">
                <form id="search-form">
                    <input type="text" id="search-input" placeholder="Search city..." autocomplete="off">
                    <button type="submit" id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button type="button" id="location-btn" title="Use My Location"><i class="fa-solid fa-location-crosshairs"></i></button>
                </form>
            </div>
            <div class="unit-toggle">
                <button id="unit-c" class="active">°C</button>
                <button id="unit-f">°F</button>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="hidden">
            <!-- Current Weather -->
            <section class="current-weather glass-card">
                <div class="location-header">
                    <h2 id="city-name">--</h2>
                    <p id="current-date">--</p>
                </div>
                <div class="weather-main">
                    <div class="weather-icon-large">
                        <i id="current-icon" class="fa-solid fa-cloud"></i>
                    </div>
                    <div class="temperature">
                        <span id="current-temp">--</span><span class="unit-symbol">°C</span>
                    </div>
                    <div class="weather-desc">
                        <p id="current-desc">--</p>
                        <p class="feels-like">Feels like <span id="feels-like-temp">--</span>°</p>
                    </div>
                </div>
            </section>

            <!-- Weather Details Grid -->
            <section class="weather-details">
                <div class="detail-card glass-card">
                    <i class="fa-solid fa-droplet"></i>
                    <div class="detail-info">
                        <span class="detail-label">Humidity</span>
                        <span class="detail-value" id="humidity">--%</span>
                    </div>
                </div>
                <div class="detail-card glass-card">
                    <i class="fa-solid fa-wind"></i>
                    <div class="detail-info">
                        <span class="detail-label">Wind</span>
                        <span class="detail-value" id="wind-speed">-- m/s</span>
                    </div>
                </div>
                <div class="detail-card glass-card">
                    <i class="fa-solid fa-sun"></i>
                    <div class="detail-info">
                        <span class="detail-label">UV Index</span>
                        <span class="detail-value" id="uv-index">--</span>
                    </div>
                </div>
                <div class="detail-card glass-card">
                    <i class="fa-solid fa-gauge-high"></i>
                    <div class="detail-info">
                        <span class="detail-label">Pressure</span>
                        <span class="detail-value" id="pressure">-- hPa</span>
                    </div>
                </div>
            </section>

            <!-- AI Insights Section -->
            <section class="ai-insights-section glass-card">
                <h3><i class="fa-solid fa-wand-magic-sparkles"></i> AI Smart Summary</h3>
                <div id="ai-insight-content">
                    <div id="ai-loading" class="ai-loading hidden">
                        <div class="spinner small-spinner"></div>
                        <p>Generating smart insights...</p>
                    </div>
                    <div id="ai-text" class="ai-text hidden"></div>
                </div>
            </section>

            <!-- Forecast Section -->
            <section class="forecast-section glass-card">
                <h3>7-Day Forecast</h3>
                <div class="forecast-list" id="forecast-list">
                    <!-- Forecast items injected via JS -->
                </div>
            </section>
        </main>
        
        <!-- Loading State -->
        <div id="loading-state" class="state-container hidden">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="state-container hidden">
            <i class="fa-solid fa-triangle-exclamation error-icon"></i>
            <h2 id="error-title">Oops!</h2>
            <p id="error-msg">Something went wrong.</p>
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="state-container">
            <i class="fa-solid fa-cloud-bolt empty-icon"></i>
            <h2>Welcome to SkyCast</h2>
            <p>Search for a city or use your location to see the weather.</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
